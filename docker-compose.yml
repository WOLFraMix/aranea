services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s            # брокеру нужно время стартовать — не считаем ранние проверки

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # GUI для Kafka: топики, сообщения, лаги консюмер-групп
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  # GUI для Redis: все ключи, их содержимое и TTL, встроенный CLI
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      KAFKA_ADDR: redpanda:9092
      REDIS_ADDR: redis:6379
      DB_PATH: /data/aranea.db
      MAX_DEPTH: "3"
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  fetcher:
    build:
      context: .
      args:
        SERVICE: fetcher
    environment:
      KAFKA_ADDR: redpanda:9092
      REDIS_ADDR: redis:6379
      MAX_DEPTH: "3"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    build:
      context: .
      args:
        SERVICE: indexer
    environment:
      KAFKA_ADDR: redpanda:9092
      REDIS_ADDR: redis:6379
      DB_PATH: /data/aranea.db
      MAX_DEPTH: "3"
    volumes:
      - app-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redpanda-data:
  redis-data:
  redisinsight-data:
  app-data:
